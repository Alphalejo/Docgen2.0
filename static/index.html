<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document Builder</title>
    <link rel="stylesheet" href="/static/style.css">
    <link rel="icon" type="image/png" href="/static/favicon.png">
</head>
<body>
    <!-- HEADER -->
    <header class="header">
        <div class="header-left">
            <img id="logo-light" src="/static/logo-light.png" alt="Logo" style="height: 48px;">
            <img id="logo-dark" src="/static/logo-dark.png" alt="Logo" style="height: 48px; display:none;">
            <span class="logo">DocBuilder</span>
        </div>
        <div class="header-right">
            <select id="template-select" class="doc-select"></select>
            <button class="icon-btn" onclick="toggleTheme()" id="theme-toggle" title="Toggle theme">🌙</button>
            <button class="icon-btn" onclick="toggleLang()" id="lang-toggle" title="Toggle language">ES</button>
            <button class="icon-btn" onclick="toggleMenu()" title="Menu">&#9776;</button>
        </div>
    </header>

    <!-- BODY -->
    <div class="app-body">

        <!-- VISUALIZER -->
        <div class="panel viewer">
            <div class="panel-header viewer-header">
                <span data-i18n="live_preview">Live Preview</span>
                <div class="doc-lang-toggle">
                    <button class="doc-lang-btn active" id="doc-lang-en" onclick="setDocLang('en')">EN</button>
                    <button class="doc-lang-btn" id="doc-lang-es" onclick="setDocLang('es')">ES</button>
                </div>
            </div>
            <div class="viewer-body">
                <iframe id="preview-frame" scrolling="no"></iframe>
            </div>
        </div>

        <!-- EDITOR -->
        <div class="panel editor">
            <div class="panel-header" data-i18n="doc_builder">Document Builder</div>
            <div class="editor-content">
                <div class="scrollable-form">
                    <form id="dynamic-form"></form>
                </div>
                <div class="actions-bottom">
                    <input type="file" id="json-upload" accept=".json" style="display:none;">
                    <div class="btn-row">
                        <button class="btn-outline" id="btn-load-json" data-i18n="load_json">Load JSON</button>
                        <button class="btn-success" id="btn-pdf" data-i18n="download_pdf">Download PDF</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- SIDE MENU -->
        <div class="side-menu" id="side-menu">
            <div class="side-menu-header" data-i18n="settings">Settings</div>
            <div class="side-menu-body">
                <div style="display:flex; flex-direction:column; gap:8px;">
                    <button class="btn-primary" id="btn-preview" data-i18n="force_preview">Force Preview Refresh</button>
                    <button class="btn-success" id="btn-docx" data-i18n="download_docx">Download DOCX</button>
                </div>
            </div>
        </div>

    </div>

    <script src="/static/i18n.js"></script>
    <script src="/static/main.js"></script>
</body>
</html>
